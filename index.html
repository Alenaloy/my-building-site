<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sintez.Space</title>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 0, 100);

        let isAnimating = true;
        let t = 0;

        const loader = new THREE.GLTFLoader();
        const draco = new THREE.DRACOLoader();
        draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
        loader.setDRACOLoader(draco);
        
        loader.load('scan2.glb', (gltf) => {
            gltf.scene.traverse(obj => {
                if(obj.isMesh) {
                    if(obj.name.toLowerCase().includes('korpus')) {
                        obj.material = new THREE.MeshBasicMaterial({color: 0x444444, wireframe: true, transparent: true, opacity: 0.1});
                    } else {
                        // Уменьшаем яркость
                        if(obj.material) {
                            obj.material.emissive.set(0x000000);
                            obj.material.color.multiplyScalar(0.6); 
                        }
                        // Вариативность этажей (случайный сдвиг)
                        if(obj.position.y > 1) obj.position.z += Math.sin(obj.position.y) * 0.5;
                    }
                }
            });
            scene.add(gltf.scene);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isAnimating) {
                t += 0.005;
                camera.position.x = Math.sin(t) * 20;
                camera.position.z = 50 - (t * 10);
                if (t > 4) isAnimating = false; // Полет длится 4 секунды
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
