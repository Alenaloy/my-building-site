<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sintez.Space</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        
        // Начальная позиция камеры
        camera.position.set(0, 50, 200);

        const loader = new THREE.GLTFLoader();
        const draco = new THREE.DRACOLoader();
        draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
        loader.setDRACOLoader(draco);
        
        let building;
        let isFlying = true;

        loader.load('scan2.glb', (gltf) => {
            building = gltf.scene;
            
            building.traverse(obj => {
                if(obj.isMesh) {
                    // Создаем сетку-обертку поверх сжатой модели
                    const wireframe = new THREE.Mesh(
                        obj.geometry,
                        new THREE.MeshBasicMaterial({
                            color: 0x888888,
                            wireframe: true,
                            transparent: true,
                            opacity: 0.2
                        })
                    );
                    obj.add(wireframe);
                    
                    // Приглушаем яркость оригинальной модели
                    if(obj.material) {
                        obj.material.color.set(0x333333);
                    }
                }
            });
            scene.add(building);
        });

        // Анимация полета камеры
        let t = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            if (isFlying && t < 1) {
                t += 0.005; // Скорость полета
                camera.position.z = 200 - (t * 150);
                camera.position.y = 50 - (t * 40);
                if (t >= 1) isFlying = false;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Адаптивность
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
